spring.datasource.url=${DB_URL_TEST:jdbc:postgresql://localhost:5432/fastorder_test}
spring.datasource.username=${DB_USERNAME_TEST:fastorder}
spring.datasource.password=${DB_PASSWORD_TEST:fastorder_dev_password}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

logging.level.root=WARN
logging.level.com.fastorder=INFO
logging.level.org.hibernate.SQL=WARN
