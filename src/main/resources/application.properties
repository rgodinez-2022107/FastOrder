spring.application.name=fastorder
server.port=8085
server.error.include-stacktrace=never
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fastorder}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=admin

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1200000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.jakarta.persistence.lock.timeout=${DB_LOCK_TIMEOUT_MS:5000}

spring.sql.init.mode=${SQL_INIT_MODE:always}

fastorder.jwt.secret=${JWT_SECRET:fastorder-dev-secret-change-me-0123456789abcdef0123}
fastorder.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
fastorder.shipping-cost=20.00

logging.level.root=INFO
logging.level.com.fastorder=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=WARN
